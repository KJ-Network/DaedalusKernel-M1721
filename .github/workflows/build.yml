name: Build DaedalusKernel M1721
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build DaedalusKernel M1721 by ${{ github.actor }}
    runs-on: ubuntu-24.04
    steps:

      - name: Set Beijing Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP To 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc python3 -y
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
          
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Toolchain
        run: |
          git clone -q https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git -b 12 --depth 1 toolchain/clang
          git clone -q https://github.com/KJ-Network/gcc-linaro-5.5.0-2017.10-x86_64_arm-linux-gnueabi.git --depth=1 toolchain/gcc32
          git clone -q https://github.com/KJ-Network/gcc-linaro-5.5.0-2017.10-x86_64_aarch64-linux-gnu.git --depth=1 toolchain/gcc64
          
      - name: Processing Submodules
        run: |
          git submodule update --init --remote --rebase --recursive android/Installer

      - name: Build Kernel
        run: |
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          make O=out m1721_daedalus_defconfig
          make -j$(nproc --all) O=out

      - name: Pack Kernel
        run: |
          cp out/arch/arm64/boot/Image android/Installer/
          cp out/arch/arm64/boot/dts/qcom/*.dtb android/Installer/
          
      - name: Upload Kernel Package
        uses: actions/upload-artifact@v4
        with:
          name: DaedalusKernel_Installer_${{ env.BUILD_TIME }}
          path: android/Installer/*
